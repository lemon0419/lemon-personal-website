  /* ================= 舞台 ================= */
  .stage{
    position:relative;
    width:min(94vw, 900px);
    height:min(76vh, 720px);
    perspective: 2300px;
    perspective-origin: 50% 44%;
  }
  .card{
    position:absolute; left:50%; top:62%; z-index:3;
    width:100%; aspect-ratio: 800/520;
    transform: translate(-50%,-50%) scale(.94);
    transform-style:preserve-3d;
    transition: transform 1.4s cubic-bezier(.4,.05,.2,1);
  }
  .card.open{ transform: translate(-50%,-50%) translateY(10px) scale(.66); }

  /* 桌面倾角（整张卡躺在桌面上，相机在上方俯看） */
  .table{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform: rotateX(42deg);
    transition: transform 1.4s cubic-bezier(.4,.05,.2,1);
  }
  .card.open .table{ transform: rotateX(68deg); }

  /* 卡片投影 */
  .shadow3d{
    position:absolute; inset:-2% -8% -6% -2%;
    transform: translateZ(-46px) translateX(5%);
    background: rgba(90,78,58,.34);
    filter: blur(24px);
    border-radius: 18px;
    transition: opacity 1.2s;
  }

  /* ================= 底板（水平纸面） ================= */
  .base{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform: translateZ(-1px);
    visibility:hidden;
  }
  .card.open .base{ visibility:visible; }
  .base-print{ position:absolute; inset:0; width:100%; height:100%; }

  /* ================= 立起来的纸片（弹出件） ================= */
  .piece{
    position:absolute;
    transform-origin: 50% 100%;
    transform-style:preserve-3d;
    transform: translateX(var(--tx,0)) rotateX(0deg) translateZ(0);
    opacity:0;
    transition: transform 1.05s cubic-bezier(.22,1.28,.36,1), opacity .45s;
    will-change: transform;
  }
  .card.open .piece{
    transform: translateX(var(--tx,0)) rotateX(-90deg) translateZ(0);
    opacity:1;
  }
  .piece svg, .piece img{ display:block; }
  .piece svg{ width:100%; height:auto; }

  /* 落地投影（平贴底板） */
  .fshadow{
    position:absolute; border-radius:50%;
    background: rgba(95,72,45,.18);
    filter: blur(9px);
    opacity:0; transition: opacity .8s .85s;
    pointer-events:none;
  }
  .card.open .fshadow{ opacity:1; }

  /* ---------- 各部件位置（bottom 越小越靠前） ---------- */
  /* 两簇气球：站在人物身后，气球升到头顶之上 */
  .k-balls-l{ left:-5%; bottom:44%; width:24%; --tx:0; z-index:1; transition-delay:1.02s; }
  .k-balls-r{ right:-5%; bottom:44%; width:24%; --tx:0; z-index:1; transition-delay:1.06s; }
  .k-balls-r svg{ transform: scaleX(-1); }

  /* 两张单人：靠后站（bottom 更大），个头更高，露出整张脸 */
  .k-p2{ left:16%; bottom:42%; height:68%; --tx:0; z-index:2; transition-delay:1.10s; }
  .k-p3{ left:43%; bottom:42%; height:74%; --tx:0; z-index:2; transition-delay:1.14s; }

  /* 两张合照：靠前站，压在前面，脸一个都不挡 */
  .k-p1{ left:-2%; bottom:34%; height:57%; --tx:0; z-index:3; transition-delay:1.18s; }
  .k-p4{ right:-2%; bottom:34%; height:58%; --tx:0; z-index:3; transition-delay:1.22s; }

  /* 草莓熊：坐在右前方 */
  .k-bear{ right:8%; bottom:8%; height:26%; --tx:0; z-index:5; transition-delay:1.34s; }

  /* 蛋糕：正中 */
  .k-cake{ left:50%; bottom:15%; width:23%; --tx:-50%; z-index:6; transition-delay:1.42s; }
  .k-banner{ left:50%; bottom:3%; width:23%; --tx:-50%; z-index:7; transition-delay:1.48s; }

  .k-person img, .k-bear img{ height:100%; width:auto; }

  /* 人物纸片白边 + 厚度投影 */
  .k-person img{
    filter:
      drop-shadow(2.5px 0 0 #fdf8ea) drop-shadow(-2.5px 0 0 #fdf8ea)
      drop-shadow(0 2.5px 0 #fdf8ea) drop-shadow(0 -2.5px 0 #fdf8ea)
      drop-shadow(6px 10px 6px rgba(80,60,40,.28));
    -webkit-mask-image: linear-gradient(to bottom, #000 84%, rgba(0,0,0,0) 99%);
    mask-image: linear-gradient(to bottom, #000 84%, rgba(0,0,0,0) 99%);
  }
  .k-bear img{
    filter:
      drop-shadow(2.6px 0 0 #fdf8ea) drop-shadow(-2.6px 0 0 #fdf8ea)
      drop-shadow(0 2.6px 0 #fdf8ea) drop-shadow(0 -2.6px 0 #fdf8ea)
      drop-shadow(5px 9px 6px rgba(80,60,40,.26));
  }
  .k-cake svg, .k-banner svg{
    filter: drop-shadow(5px 9px 5px rgba(80,60,40,.26));
  }
  .k-balls-l svg, .k-balls-r svg{
    filter: drop-shadow(3px 6px 4px rgba(80,60,40,.2));
  }

  /* ================= 封盖 ================= */
  .lid{
    position:absolute; inset:0;
    transform-style:preserve-3d;
    transform-origin: 50% 0%;
    transform: translateZ(4px) rotateX(0deg);
    transition: transform 1.35s cubic-bezier(.45,.08,.25,1);
  }
  .card.open .lid{ transform: translateZ(4px) rotateX(90deg); }

  .lid-face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:12px; overflow:hidden;
  }
  .lid-cover{
    box-shadow: 0 8px 26px rgba(70,60,40,.3);
    background:#f9f2e1;
  }
  .lid-cover .cover-art{ position:absolute; inset:0; width:100%; height:100%; }
  .lid-cover .cover-bear{
    position:absolute; right:1%; bottom:-4%; height:47%;
    filter: drop-shadow(-3px 6px 10px rgba(110,80,55,.16));
  }

  .lid-scene{ transform: rotateX(180deg) translateZ(2px); background:#e6d8bb; transform-style:preserve-3d; }
  .lid-scene .scene-inner{
    position:absolute; inset:8px 8px -14px 8px; border-radius:4px 4px 0 0; overflow:hidden; background:#f9f2e1;
  }
  .wall-art{ position:absolute; inset:0; width:100%; height:100%; }

  /* 墙前散落的纸屑（悬浮层） */
  .wall-stars{
    position:absolute; inset:0;
    transform: translateZ(-19px);
    pointer-events:none;
  }
  .wall-stars svg{ display:block; width:100%; height:100%; }

  /* 悬浮在墙面上的立体彩旗（真正脱离墙面） */
  .wall-bunting{
    position:absolute; left:-1%; top:4%; width:102%;
    transform: translateZ(-26px);
    filter: drop-shadow(0 8px 7px rgba(90,70,45,.3));
  }
  .wall-bunting svg{ display:block; width:100%; height:auto; }

  /* 折线阴影（贴在底板上，靠近后墙处） */
  .fold-shadow{
    position:absolute; left:0; right:0; top:0; height:16%;
    background: linear-gradient(180deg, rgba(80,58,35,.26), rgba(80,58,35,0) 100%);
    opacity:0; transition: opacity .9s .7s;
    pointer-events:none;
  }
  .card.open .fold-shadow{ opacity:1; }

  /* ================= 钱雨 ================= */
  .confetti-layer{ position:absolute; inset:-10% 0 0 0; pointer-events:none; z-index:20; overflow:hidden; perspective:900px; }

  /* 钞票：绿钞为主，少量金票 */
  .money{
    position:absolute; top:-9%; width:50px; height:26px; opacity:0;
    display:grid; place-items:center;
    background:
      radial-gradient(ellipse 24% 42% at 50% 50%, rgba(255,252,232,.62) 0 62%, rgba(255,252,232,0) 100%),
      linear-gradient(158deg,#8cc173 0%,#6aa455 46%,#7cb465 100%);
    border:1.8px solid #f7f0d4; border-radius:2.5px;
    box-shadow:
      inset 0 0 0 1.5px rgba(48,92,40,.5),
      inset 0 0 0 3.2px rgba(255,250,225,.5),
      0 2px 5px rgba(70,70,50,.22);
    font-family:Georgia,'Times New Roman',serif; font-weight:bold; font-size:15px;
    color:#416f36; letter-spacing:.5px;
    animation: moneyFall linear forwards;
    will-change: transform, opacity;
    backface-visibility:visible;
  }
  .money::after{ content:'¥'; }
  .money.gold{
    background:
      radial-gradient(ellipse 24% 42% at 50% 50%, rgba(255,255,246,.66) 0 62%, rgba(255,255,246,0) 100%),
      linear-gradient(158deg,#f6e3a2 0%,#e3c264 48%,#f0d78e 100%);
    color:#87671b;
    box-shadow:
      inset 0 0 0 1.5px rgba(146,110,32,.42),
      inset 0 0 0 3.2px rgba(255,252,238,.55),
      0 2px 5px rgba(120,90,30,.22);
  }
  .money.blue{
    background:
      radial-gradient(ellipse 24% 42% at 50% 50%, rgba(255,255,255,.62) 0 62%, rgba(255,255,255,0) 100%),
      linear-gradient(158deg,#a3c6e2 0%,#7fadd3 48%,#98bedd 100%);
    color:#2b577a;
  }

  /* 金币 */
  .coin{
    position:absolute; top:-9%; width:18px; height:18px; border-radius:50%; opacity:0;
    background:radial-gradient(circle at 34% 30%,#fff2bd 0 18%,#ecc45c 42%,#c99b2c 100%);
    box-shadow: 0 1px 3px rgba(140,100,30,.3);
    animation: moneyFall linear forwards;
    will-change: transform, opacity;
  }

  @keyframes moneyFall{
    0%  { opacity:0; transform: translate3d(0,-100px,0) rotate3d(.3,.46,1,0deg) scale(.92); }
    7%  { opacity:var(--maxo,.94); }
    45% { transform: translate3d(calc(var(--sx) * .55), 56vh, 0) rotate3d(.3,.46,1,220deg) scale(1); }
    86% { opacity:calc(var(--maxo,.94) * .95); }
    100%{ opacity:0; transform: translate3d(var(--sx), 126vh, 0) rotate3d(.3,.46,1,520deg) scale(1); }
  }

  /* ================= 卡外飘散纸屑 ================= */
  .air{ position:absolute; inset:-30% -20%; pointer-events:none; z-index:1; }
  .air i{
    position:absolute; display:block; opacity:.8;
    animation: airFloat 7s ease-in-out infinite alternate;
  }
  @keyframes airFloat{
    from{ transform: translate3d(0,0,0) rotate(0deg); }
    to{ transform: translate3d(14px,-26px,0) rotate(160deg); }
  }

  /* ================= 音乐开关 ================= */
  .music{
    position:fixed; right:16px; bottom:16px; z-index:40;
    width:44px; height:44px; border-radius:50%; border:none; cursor:pointer;
    background:#2f6b53; color:#fdf8ea;
    display:grid; place-items:center;
    box-shadow: 0 3px 0 #1e4a38, 0 7px 16px rgba(60,80,60,.26);
    transition: transform .16s ease, background .2s ease;
  }
  .music:active{ transform: translateY(2px); }
  .music.muted{ background:#b8ad94; box-shadow: 0 3px 0 #8f8672, 0 7px 16px rgba(60,80,60,.18); }
  .music svg{ width:22px; height:22px; display:block; }
  .music .ico-off{ display:none; }
  .music.muted .ico-on{ display:none; }
  .music.muted .ico-off{ display:block; }
  .music.playing .ico-on{ animation: noteBeat 1.05s ease-in-out infinite; }
  @keyframes noteBeat{
    0%,100%{ transform:scale(1) }
    50%{ transform:scale(1.16) }
  }

  /* ================= 按钮 ================= */
  .pill{
    margin-top:2vh;
    font-family:inherit; font-weight:bold; font-size:17px; letter-spacing:1px;
    color:#fdf8ea; background:#2f6b53;
    border:none; border-radius:999px; padding:12px 30px;
    box-shadow: 0 4px 0 #1e4a38, 0 8px 16px rgba(60,80,60,.3);
    cursor:pointer; position:relative; z-index:30;
    transition: transform .15s;
  }
  .pill::after{ content:""; position:absolute; inset:5px; border:2px dashed rgba(253,248,234,.7); border-radius:999px; }
  .pill:active{ transform: translateY(3px); }
  .hint{ margin-top:9px; color:#8a7f68; font-size:13px; letter-spacing:2px; z-index:30; }

  .no-anim *{ transition: none !important; animation: none !important; }

  /* 手机竖屏：整卡放大铺满 */
  @media (max-width: 700px){
    .stage{ width:100vw; height:min(64vh, 600px); perspective: 1200px; }
    .card{ top:55%; width:92%; }
    .card.open{ transform: translate(-50%,-50%) translateY(14px) scale(.86); }
    .pill{ margin-top:1vh; }
  }
</style>

<script>
  const card = document.getElementById('card');
  const pill = document.getElementById('pill');
  const cfl  = document.getElementById('cfl');
  const bgm  = document.getElementById('bgm');
  const musicBtn = document.getElementById('musicBtn');
  const openParam = new URLSearchParams(location.search).get('open');

  /* ---------------- 背景音乐 ---------------- */
  let musicOn = true;          // 用户意图：是否开声音
  let musicReady = false;      // 音频是否真的在放

  function playMusic(){
    if(!bgm || !musicOn) return;
    try{
      bgm.currentTime = 0;
      const p = bgm.play();
      if(p && typeof p.then === 'function'){
        p.then(()=>{ musicReady = true; syncMusicBtn(); })
         .catch(()=>{ musicReady = false; syncMusicBtn(); });
      }
    }catch(e){ musicReady = false; syncMusicBtn(); }
  }
  function stopMusic(){
    if(!bgm) return;
    try{ bgm.pause(); }catch(e){}
    musicReady = false;
    syncMusicBtn();
  }
  function syncMusicBtn(){
    if(!musicBtn) return;
    musicBtn.classList.toggle('muted', !musicOn);
    musicBtn.classList.toggle('playing', musicOn && musicReady);
  }
  if(musicBtn){
    musicBtn.addEventListener('click', e => {
      e.stopPropagation();
      musicOn = !musicOn;
      if(musicOn){ playMusic(); } else { stopMusic(); }
      syncMusicBtn();
    });
  }
  syncMusicBtn();

  /* ---------------- 状态 ---------------- */
  function setOpen(v){ card.classList.toggle('open', v); pill.textContent = v ? 'close card' : 'open me!'; }

  /* ---------------- 钱雨 ---------------- */
  function moneyRain(){
    cfl.innerHTML = '';
    const NOTES = ['', '', '', 'gold', '', '', 'blue', ''];
    const narrow = window.innerWidth < 700;           // 手机上卡片占比大，钱要小、要少
    const total  = narrow ? 40 : 52;
    for(let i=0;i<total;i++){
      const isCoin = Math.random() < 0.15;
      const el = document.createElement('i');
      el.className = isCoin ? 'coin' : ('money ' + NOTES[i % NOTES.length]);
      const scale = narrow ? (0.7 + Math.random()*0.34) : (0.9 + Math.random()*0.38);
      el.style.left = (Math.random()*104 - 2) + '%';
      el.style.setProperty('--sx', (Math.random()*180 - 90).toFixed(0) + 'px');
      el.style.animationDuration = (2.8 + Math.random()*1.9).toFixed(2) + 's';
      el.style.animationDelay = (Math.random()*1.15).toFixed(2) + 's';
      el.style.width = (50*scale).toFixed(0) + 'px';
      el.style.height = (26*scale).toFixed(0) + 'px';
      el.style.fontSize = (16*scale).toFixed(0) + 'px';
      if(isCoin){ el.style.width = el.style.height = (18*scale).toFixed(0) + 'px'; }
      el.style.filter = 'brightness(' + (0.94 + Math.random()*0.12).toFixed(2) + ')';
      // 落在画面中间（人物所在区）的钞票更透明，避免糊住脸
      const xp = parseFloat(el.style.left);
      el.style.setProperty('--maxo', (xp > 28 && xp < 74) ? '.8' : '.95');
      cfl.appendChild(el);
    }
    setTimeout(()=>{ cfl.innerHTML=''; }, 7200);
  }

  function toggle(){
    const opening = !card.classList.contains('open');
    setOpen(opening);
    if(opening){ moneyRain(); playMusic(); }
    else { stopMusic(); }
  }
  card.addEventListener('click', toggle);
  pill.addEventListener('click', e => { e.stopPropagation(); toggle(); });
  if(openParam === '1'){ card.classList.add('no-anim'); setOpen(true); }
  if(new URLSearchParams(location.search).get('rain') === '1'){ setTimeout(moneyRain, 60); }

  /* 音频自检：?audiotest=1 时把解码结果写进标题，便于无头验证 */
  if(new URLSearchParams(location.search).get('audiotest') === '1' && bgm){
    bgm.addEventListener('loadedmetadata', ()=>{ document.title = 'AUDIO_OK ' + bgm.duration.toFixed(2) + 's'; });
    bgm.addEventListener('error', ()=>{ document.title = 'AUDIO_ERR ' + (bgm.error && bgm.error.code); });
    setTimeout(()=>{ if(document.title.indexOf('AUDIO_') < 0) document.title = 'AUDIO_TIMEOUT ' + bgm.readyState; }, 4000);
  }

  /* 卡外飘散纸屑 */
  (function(){
    const box = document.getElementById('air'); if(!box) return;
    const cols = ['#f0d98c','#e9c96f','#f7e8b6','#dcbf7d','#f3e2a4','#e3cd8b'];
    let seed = 77713;
    const rnd = () => (seed = (seed*9301 + 49297) % 233280) / 233280;
    for(let i=0;i<26;i++){
      const el = document.createElement('i');
      const w = 6 + Math.round(rnd()*6);
      el.style.left = (rnd()*100)+'%';
      el.style.top = (rnd()*100)+'%';
      el.style.width = w+'px';
      el.style.height = (w*1.5)+'px';
      el.style.background = cols[i % cols.length];
      el.style.borderRadius = rnd()>.5 ? '50%' : '2px';
      el.style.animationDelay = (rnd()*6).toFixed(2)+'s';
      el.style.animationDuration = (5+rnd()*4).toFixed(2)+'s';
      box.appendChild(el);
    }
  })();
</script>
</body>
